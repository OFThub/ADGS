[project]
name = "adgs"
version = "0.1.0"
description = "Trafik video analiz sistemi - karar destek araci (Arnavutkoy Belediyesi staj projesi)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "ultralytics>=8.3",
    # BoT-SORT/ByteTrack lineer atama cozucusu. Ultralytics bunu opsiyonel
    # birakiyor ama model.track() onsuz calismaz - hem M2 takip hem M5 yol
    # hasari tekillestirmesi buna bagli.
    "lap>=0.5",
    "opencv-python>=4.10",
    # Isaretli videoyu TARAYICIDA oynayan boyutta yazmak icin ffmpeg ikilisi.
    # opencv-python H.264 bit hizini AYARLAMIYOR (OPENCV_FFMPEG_WRITER_OPTIONS
    # yok sayiliyor) ve 5 dakikalik 720p videoyu 963 MB yaziyor; ayni goruntu
    # ffmpeg + CRF ile 34 MB. Ayrica +faststart ile video tamamen inmeden
    # oynamaya basliyor. Bulunamazsa render OpenCV'ye duser - zorunlu degil.
    "imageio-ffmpeg>=0.5",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
# Faz 7 servisi. Cekirdek CLI bunlari gerektirmesin diye ayri ekstra.
# PDF icin ayri kutuphane YOK: matplotlib zaten ultralytics ile geliyor ve
# DejaVu fontuyla Turkce karakterleri dogru basiyor (bkz. adgs/workorder.py).
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
adgs = "adgs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat-layout otomatik kesfi data/, config/, training/ dizinlerini de paket
# sanip build'i durduruyor. Tek gercek paket adgs.
[tool.setuptools]
packages = ["adgs", "adgs.violations"]

# Tek sayfalik arayuz paket icinde tasinir (adgs/web/index.html).
[tool.setuptools.package-data]
adgs = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
